name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit + API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: founder_portal_test
          POSTGRES_USER: fp_ci
          POSTGRES_PASSWORD: change-me  # throw-away CI database, not a real credential
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_DB: founder_portal_test
      PG_USER: fp_ci
      PG_PASSWORD: change-me
      NEWS_FETCH_ENABLED: "0"
      EMAIL_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 backend tests
      - name: dist/ matches the frontend source
        run: python scripts/sync_dist.py && git diff --exit-code -- dist
      - name: Unit tests
        run: pytest -q
      - name: Integration tests (seeded Postgres)
        env:
          FP_TEST_DB: "1"
        run: pytest -q tests/test_api_integration.py
